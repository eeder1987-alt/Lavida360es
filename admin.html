<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel productos | La Vida 360 ES</title>
<style>body{font-family:Arial;margin:0;background:#f4f4f4}.head{background:#090909;color:white;padding:18px}.head b{color:#ffd21f}.wrap{max-width:850px;margin:auto;padding:18px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:18px;margin:14px 0}label{display:block;font-weight:700;margin:10px 0 5px}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bbb;border-radius:8px;font-size:16px}button{padding:12px 15px;border:0;border-radius:8px;font-weight:900;margin-top:10px}.yellow{background:#ffd21f}.dark{background:#111;color:white}.item{border-top:1px solid #eee;padding:10px 0}.small{font-size:12px;color:#666}</style></head>
<body><div class="head"><div class="wrap"><h1>La Vida <b>360 ES</b> · Panel</h1></div></div><div class="wrap">
<div class="card"><b>Fácil:</b> rellena el producto, pulsa Añadir y después descarga <b>productos.json</b>.</div>
<div class="card"><h2>Añadir producto</h2><label>Nombre</label><input id="n"><label>Categoría</label><select id="c"><option>Moda</option><option>Hogar</option><option>Alimentación</option><option>Tecnología</option><option>Otros</option></select><label>Ruta de imagen</label><input id="im" placeholder="images/producto-12.jpg"><label>Enlace Amazon</label><input id="a" placeholder="https://amzn.eu/d/..."><label>Descripción</label><textarea id="d"></textarea><button class="yellow" onclick="add()">＋ Añadir</button></div>
<div class="card"><h2>Productos</h2><div id="list">Cargando...</div></div>
<div class="card"><button class="dark" onclick="download()">⬇ Descargar productos.json actualizado</button><p class="small">La publicación totalmente automática requiere conectar la web a GitHub/Netlify. Este panel ya evita editar la portada a mano.</p></div>
</div><script>let ps=[];fetch('/productos.json?x='+Date.now()).then(r=>r.json()).then(x=>{ps=x;draw()});function draw(){list.innerHTML=ps.map((p,i)=>`<div class="item"><b>${p.nombre}</b><div class="small">${p.categoria} · ${p.amazon}</div><button onclick="del(${i})">Eliminar</button></div>`).join('')}function add(){if(!n.value.trim()||!im.value.trim()||!a.value.trim()){alert('Rellena nombre, imagen y enlace');return}let id=ps.length?Math.max(...ps.map(x=>+x.id||0))+1:1;ps.push({id,slug:'producto-'+id,nombre:n.value.trim(),categoria:c.value,imagen:im.value.trim(),amazon:a.value.trim(),descripcion:d.value.trim()});draw();n.value=im.value=a.value=d.value=''}function del(i){if(confirm('¿Eliminar?')){ps.splice(i,1);draw()}}function download(){let b=new Blob([JSON.stringify(ps,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),x=document.createElement('a');x.href=u;x.download='productos.json';x.click();URL.revokeObjectURL(u)}</script></body></html>
