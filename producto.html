<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Producto | La Vida 360 ES</title>
<style>body{margin:0;font-family:Arial;background:#f5f5f5}.top{background:#090909;color:white;padding:18px}.top a{color:#ffd21f;text-decoration:none;font-weight:900}.wrap{max-width:900px;margin:25px auto;padding:0 16px}.box{display:grid;grid-template-columns:1fr 1fr;background:white;border-radius:18px;overflow:hidden;border:1px solid #ddd}.box img{width:100%;height:100%;object-fit:contain}.copy{padding:26px}.tag{background:#fff0a8;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:900}.btn{display:block;text-align:center;padding:13px;border-radius:8px;font-weight:900;text-decoration:none;margin-top:10px;border:0;width:100%;box-sizing:border-box}.yellow{background:#ffd21f;color:#111}.dark{background:#111;color:#fff}.url{padding:10px;background:#eee;border-radius:8px;margin-top:10px;word-break:break-all;font-size:13px}@media(max-width:650px){.box{grid-template-columns:1fr}}</style></head>
<body><div class="top"><a href="/">← La Vida 360 ES</a></div><div class="wrap"><div class="box" id="box">Cargando...</div></div>
<script>const id=new URLSearchParams(location.search).get('id');fetch('/productos.json?x='+Date.now()).then(r=>r.json()).then(ps=>{const p=ps.find(x=>String(x.id)===String(id));if(!p){box.innerHTML='<div class="copy"><h1>Producto no encontrado</h1></div>';return}document.title=p.nombre+' | La Vida 360 ES';box.innerHTML=`<img src="${p.imagen}" alt="${p.nombre}"><div class="copy"><span class="tag">${p.categoria}</span><h1>${p.nombre}</h1><p>${p.descripcion||''}</p><a class="btn yellow" href="${p.amazon}" target="_blank" rel="nofollow sponsored noopener">Comprar en Amazon</a><button class="btn dark" onclick="navigator.clipboard.writeText(location.href).then(()=>alert('Enlace copiado'))">Copiar enlace para Facebook</button><div class="url">${location.href}</div></div>`});</script></body></html>
